<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebOS — Windows Experience in Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .desktop {
      width: 100%; max-width: 900px; aspect-ratio: 16/10;
      background: linear-gradient(135deg, #0c4a6e 0%, #075985 50%, #0369a1 100%);
      border-radius: 16px; overflow: hidden; position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }
    .desktop-icons {
      padding: 24px; display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 16px; position: absolute; top: 0; left: 0; right: 0; bottom: 48px;
    }
    .desktop-icon {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 8px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.1); }
    .desktop-icon .icon { font-size: 36px; }
    .desktop-icon .label { font-size: 11px; color: white; text-align: center; }
    .taskbar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 48px;
      background: rgba(15,23,42,0.85); backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .taskbar-icon {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 20px;
    }
    .taskbar-icon:hover { background: rgba(255,255,255,0.1); }
    .start-btn {
      position: absolute; left: 12px; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;
      font-size: 20px;
    }
    .clock {
      position: absolute; right: 16px; color: white; font-size: 12px; text-align: right;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="desktop-icons">
      <div class="desktop-icon"><div class="icon">🎨</div><div class="label">Paint</div></div>
      <div class="desktop-icon"><div class="icon">📊</div><div class="label">Excel</div></div>
      <div class="desktop-icon"><div class="icon">📝</div><div class="label">Word</div></div>
      <div class="desktop-icon"><div class="icon">📽️</div><div class="label">PowerPoint</div></div>
      <div class="desktop-icon"><div class="icon">📁</div><div class="label">Files</div></div>
      <div class="desktop-icon"><div class="icon">📄</div><div class="label">Notepad</div></div>
      <div class="desktop-icon"><div class="icon">🔢</div><div class="label">Calculator</div></div>
      <div class="desktop-icon"><div class="icon">⚙️</div><div class="label">Settings</div></div>
      <div class="desktop-icon"><div class="icon">🌐</div><div class="label">Browser</div></div>
      <div class="desktop-icon"><div class="icon">⬛</div><div class="label">Terminal</div></div>
    </div>
    <div class="taskbar">
      <div class="start-btn">⊞</div>
      <div class="taskbar-icon">📁</div>
      <div class="taskbar-icon">🌐</div>
      <div class="taskbar-icon">📝</div>
      <div class="taskbar-icon">🎨</div>
      <div class="clock">
        <div id="clockTime">11:11 AM</div>
        <div id="clockDate">Sunday, Oct 25</div>
      </div>
    </div>
    <div id="winOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:12px;padding:28px 36px;text-align:center;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.4);">
        <div id="winIcon" style="font-size:48px;margin-bottom:10px;"></div>
        <h2 id="winTitle" style="margin:0 0 8px;font-size:18px;color:#1e293b;font-family:-apple-system,'Segoe UI',sans-serif;"></h2>
        <p id="winMsg" style="margin:0 0 18px;font-size:13px;color:#64748b;font-family:-apple-system,'Segoe UI',sans-serif;line-height:1.5;"></p>
        <button id="winClose" style="padding:8px 24px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;">Close</button>
      </div>
    </div>
  </div>
  <script>
    // ---- live clock in taskbar ----
    function tick() {
      var d = new Date();
      document.getElementById('clockTime').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('clockDate').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    }
    tick(); setInterval(tick, 1000);

    // ---- clickable desktop icons / start menu (were dead clicks) ----
    var overlay = document.getElementById('winOverlay');
    function openApp(name, icon) {
      document.getElementById('winIcon').textContent = icon;
      document.getElementById('winTitle').textContent = name;
      document.getElementById('winMsg').textContent = name + ' is launching… This is a demo window — wire it up to your real app next.';
      overlay.style.display = 'flex';
    }
    document.getElementById('winClose').onclick = function () { overlay.style.display = 'none'; };
    overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.style.display = 'none'; });

    document.querySelectorAll('.desktop-icon').forEach(function (el) {
      el.addEventListener('click', function () {
        openApp(el.querySelector('.label').textContent, el.querySelector('.icon').textContent);
      });
    });
    document.querySelector('.start-btn').addEventListener('click', function () {
      openApp('Start Menu', '⊞');
    });
    document.querySelectorAll('.taskbar-icon').forEach(function (el) {
      el.addEventListener('click', function () { openApp('Pinned App', el.textContent); });
    });
  </script>
</body>
</html>
