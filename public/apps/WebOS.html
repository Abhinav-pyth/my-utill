<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebOS — Windows Experience in Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .desktop {
      width: 100%; max-width: 900px; aspect-ratio: 16/10;
      background: linear-gradient(135deg, #0c4a6e 0%, #075985 50%, #0369a1 100%);
      border-radius: 16px; overflow: hidden; position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }
    .desktop-icons {
      padding: 24px; display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 16px; position: absolute; top: 0; left: 0; right: 0; bottom: 48px;
    }
    .desktop-icon {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 8px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.1); }
    .desktop-icon .icon { font-size: 36px; }
    .desktop-icon .label { font-size: 11px; color: white; text-align: center; }
    .taskbar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 48px;
      background: rgba(15,23,42,0.85); backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .taskbar-icon {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 20px;
    }
    .taskbar-icon:hover { background: rgba(255,255,255,0.1); }
    .start-btn {
      position: absolute; left: 12px; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;
      font-size: 20px;
    }
    .clock {
      position: absolute; right: 16px; color: white; font-size: 12px; text-align: right;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="desktop-icons">
      <div class="desktop-icon"><div class="icon">🎨</div><div class="label">Paint</div></div>
      <div class="desktop-icon"><div class="icon">📊</div><div class="label">Excel</div></div>
      <div class="desktop-icon"><div class="icon">📝</div><div class="label">Word</div></div>
      <div class="desktop-icon"><div class="icon">📽️</div><div class="label">PowerPoint</div></div>
      <div class="desktop-icon"><div class="icon">📁</div><div class="label">Files</div></div>
      <div class="desktop-icon"><div class="icon">📄</div><div class="label">Notepad</div></div>
      <div class="desktop-icon"><div class="icon">🔢</div><div class="label">Calculator</div></div>
      <div class="desktop-icon"><div class="icon">⚙️</div><div class="label">Settings</div></div>
      <div class="desktop-icon"><div class="icon">🌐</div><div class="label">Browser</div></div>
      <div class="desktop-icon"><div class="icon">⬛</div><div class="label">Terminal</div></div>
    </div>
    <div class="taskbar">
      <div class="start-btn">⊞</div>
      <div class="taskbar-icon">📁</div>
      <div class="taskbar-icon">🌐</div>
      <div class="taskbar-icon">📝</div>
      <div class="taskbar-icon">🎨</div>
      <div class="clock">
        <div>11:11 AM</div>
        <div>Sunday, Oct 25</div>
      </div>
    </div>
  </div>
</body>
</html>
