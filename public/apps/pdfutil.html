<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Utils</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      background: white; border-radius: 20px; padding: 40px;
      width: 100%; max-width: 600px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { font-size: 28px; color: #333; margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 32px; }
    .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .tool-card {
      padding: 24px; border: 2px solid #e2e8f0; border-radius: 16px;
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .tool-card:hover { border-color: #e11d48; background: #fff1f2; transform: translateY(-2px); }
    .tool-card .icon { font-size: 36px; margin-bottom: 12px; }
    .tool-card h3 { font-size: 16px; color: #333; margin-bottom: 4px; }
    .tool-card p { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 PDF Utils</h1>
    <p class="subtitle">All-in-one PDF toolkit</p>
    <div class="tools">
      <div class="tool-card">
        <div class="icon">🔗</div>
        <h3>Merge PDF</h3>
        <p>Combine multiple PDFs into one</p>
      </div>
      <div class="tool-card">
        <div class="icon">✂️</div>
        <h3>Split PDF</h3>
        <p>Extract pages from PDF</p>
      </div>
      <div class="tool-card">
        <div class="icon">🗜️</div>
        <h3>Compress</h3>
        <p>Reduce PDF file size</p>
      </div>
      <div class="tool-card">
        <div class="icon">🔄</div>
        <h3>Convert</h3>
        <p>PDF to Image & more</p>
      </div>
      <div class="tool-card">
        <div class="icon">🔒</div>
        <h3>Protect</h3>
        <p>Add password to PDF</p>
      </div>
      <div class="tool-card">
        <div class="icon">🔓</div>
        <h3>Unlock</h3>
        <p>Remove PDF password</p>
      </div>
    </div>
  </div>
</body>
</html>
