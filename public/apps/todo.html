<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 24px;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #667eea;
    }
    button.add-btn {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button.add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .todo-list {
      list-style: none;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.2s;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .todo-item:hover {
      background: #f1f5f9;
    }
    .todo-item.completed span {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .todo-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #667eea;
      cursor: pointer;
    }
    .todo-item span {
      flex: 1;
      font-size: 15px;
      color: #334155;
    }
    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 18px;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .todo-item:hover .delete-btn {
      opacity: 1;
    }
    .delete-btn:hover {
      background: #fef2f2;
    }
    .stats {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-top: 16px;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    .empty-state .emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Todo App</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="What needs to be done?" onkeypress="if(event.key==='Enter')addTodo()">
      <button class="add-btn" onclick="addTodo()">Add</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="stats" id="stats"></div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function render() {
      const list = document.getElementById('todoList');
      const stats = document.getElementById('stats');
      
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">📋</div><p>No todos yet. Add one above!</p></div>';
        stats.textContent = '';
        return;
      }

      list.innerHTML = todos.map((todo, i) => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}">
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${i})">
          <span>${escapeHtml(todo.text)}</span>
          <button class="delete-btn" onclick="deleteTodo(${i})">✕</button>
        </li>
      `).join('');

      const done = todos.filter(t => t.completed).length;
      stats.textContent = `${done} of ${todos.length} completed`;
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ text, completed: false });
      input.value = '';
      save();
      render();
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      save();
      render();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      save();
      render();
    }

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    render();
  </script>
</body>
</html>
