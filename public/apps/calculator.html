<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .calculator {
      background: #1e293b;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .display {
      background: #0f172a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .display .expression {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 8px;
      min-height: 20px;
    }
    .display .result {
      color: white;
      font-size: 36px;
      font-weight: 700;
      word-break: break-all;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:active {
      transform: scale(0.95);
    }
    .btn-number {
      background: #334155;
      color: white;
    }
    .btn-number:hover {
      background: #475569;
    }
    .btn-operator {
      background: #6366f1;
      color: white;
    }
    .btn-operator:hover {
      background: #818cf8;
    }
    .btn-function {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-function:hover {
      background: #334155;
      color: white;
    }
    .btn-equals {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      grid-column: span 2;
    }
    .btn-equals:hover {
      background: linear-gradient(135deg, #818cf8, #a78bfa);
    }
    .btn-clear {
      background: #ef4444;
      color: white;
    }
    .btn-clear:hover {
      background: #f87171;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">C</button>
      <button class="btn-function" onclick="backspace()">⌫</button>
      <button class="btn-function" onclick="inputOp('%')">%</button>
      <button class="btn-operator" onclick="inputOp('/')">÷</button>
      
      <button class="btn-number" onclick="inputNum('7')">7</button>
      <button class="btn-number" onclick="inputNum('8')">8</button>
      <button class="btn-number" onclick="inputNum('9')">9</button>
      <button class="btn-operator" onclick="inputOp('*')">×</button>
      
      <button class="btn-number" onclick="inputNum('4')">4</button>
      <button class="btn-number" onclick="inputNum('5')">5</button>
      <button class="btn-number" onclick="inputNum('6')">6</button>
      <button class="btn-operator" onclick="inputOp('-')">−</button>
      
      <button class="btn-number" onclick="inputNum('1')">1</button>
      <button class="btn-number" onclick="inputNum('2')">2</button>
      <button class="btn-number" onclick="inputNum('3')">3</button>
      <button class="btn-operator" onclick="inputOp('+')">+</button>
      
      <button class="btn-number" onclick="inputNum('0')">0</button>
      <button class="btn-number" onclick="inputNum('.')">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let expression = '';
    let shouldReset = false;

    function updateDisplay() {
      document.getElementById('result').textContent = current;
      document.getElementById('expression').textContent = expression;
    }

    function inputNum(num) {
      if (shouldReset) {
        current = '0';
        shouldReset = false;
      }
      if (num === '.' && current.includes('.')) return;
      if (current === '0' && num !== '.') {
        current = num;
      } else {
        current += num;
      }
      updateDisplay();
    }

    function inputOp(op) {
      expression = current + ' ' + op + ' ';
      shouldReset = true;
      updateDisplay();
    }

    function calculate() {
      if (!expression) return;
      try {
        const exp = expression + current;
        const result = Function('"use strict"; return (' + exp + ')')();
        current = String(Math.round(result * 100000000) / 100000000);
        expression = exp + ' =';
        shouldReset = true;
        updateDisplay();
      } catch (e) {
        current = 'Error';
        updateDisplay();
      }
    }

    function clearAll() {
      current = '0';
      expression = '';
      shouldReset = false;
      updateDisplay();
    }

    function backspace() {
      if (current.length > 1) {
        current = current.slice(0, -1);
      } else {
        current = '0';
      }
      updateDisplay();
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputNum(e.key);
      else if (e.key === '.') inputNum('.');
      else if (e.key === '+') inputOp('+');
      else if (e.key === '-') inputOp('-');
      else if (e.key === '*') inputOp('*');
      else if (e.key === '/') inputOp('/');
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') backspace();
    });
  </script>
</body>
</html>
